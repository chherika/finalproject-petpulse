events { 
    worker_connections 1024; 
    }

http {
    keepalive_timeout 0;
    server_tokens off;

    upstream pet_cluster {
        server pet-service-1:8003;
        server pet-service-2:8003;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://pet_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}