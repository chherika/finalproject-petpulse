apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration
  labels: { app: registration }
spec:
  replicas: 1
  selector: { matchLabels: { app: registration } }
  template:
    metadata: { labels: { app: registration } }
    spec:
      volumes:
        - name: app-logs
          persistentVolumeClaim:
            claimName: petpulse-logs-pvc
      containers:
        - name: registration
          image: petpulse/registration:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8001 }]
          env:
            - { name: NODE_ENV, value: "production" }
            - { name: PORT, value: "8001" }
            - { name: LOG_DIR, value: "/var/log/app" }
            - name: INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: petpulse-secrets, key: MONGO_URI } }
            - name: VET_INVITE_CODE
              valueFrom: { secretKeyRef: { name: petpulse-secrets, key: VET_INVITE_CODE } }
          volumeMounts:
            - { name: app-logs, mountPath: /var/log/app }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
