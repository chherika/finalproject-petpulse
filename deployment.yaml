apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-service
  labels: { app: pet-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: pet-service } }
  template:
    metadata: { labels: { app: pet-service } }
    spec:
      volumes:
        - name: app-logs
          persistentVolumeClaim:
            claimName: petpulse-logs-pvc
      containers:
        - name: pet-service
          image: petpulse/pet-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8003 }]
          env:
            - { name: NODE_ENV, value: "production" }
            - { name: PORT, value: "8003" }
            - { name: LOG_DIR, value: "/var/log/app" }
            - name: INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: petpulse-secrets, key: MONGO_URI } }
          volumeMounts:
            - { name: app-logs, mountPath: /var/log/app }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: log-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/log/app && chmod 777 /var/log/app && touch /var/log/app/pet.log && chmod 666 /var/log/app/pet.log && tail -F /var/log/app/pet.log"]
          volumeMounts:
            - { name: app-logs, mountPath: /var/log/app }
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
---
