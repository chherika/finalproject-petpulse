services:
  nginx:
    image: nginx:1.27-alpine
    container_name: petpulse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy

  api-gateway:
    build: ./API-Gateway
    image: petpulse/api-gateway:1.0.0
    container_name: petpulse-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - REGISTRATION_URL=http://registration:8001
      - LOGIN_URL=http://login:8002
      - APPOINTMENT_URL=http://appointment:8004
      - PRESCRIPTION_URL=http://prescription:8005
      - BILLING_URL=http://billing:8006
      - PET_URL=http://pet-lb:80
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      registration:
        condition: service_healthy
      login:
        condition: service_healthy
      appointment:
        condition: service_healthy
      prescription:
        condition: service_healthy
      billing:
        condition: service_healthy
      pet-lb:
        condition: service_started

  pet-lb:
    image: nginx:1.27-alpine
    container_name: petpulse-pet-lb
    restart: unless-stopped
    volumes:
      - ./pet-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      pet-service-1:
        condition: service_healthy
      pet-service-2:
        condition: service_healthy

  pet-service-1:
    build: ./Pet_Profile
    image: petpulse/pet-service:1.0.0
    container_name: petpulse-pet-service-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8003
      - INSTANCE_ID=Pet-Service-Node-1
      - MONGO_URI=${MONGO_URI}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  pet-service-2:
    build: ./Pet_Profile
    image: petpulse/pet-service:1.0.0
    container_name: petpulse-pet-service-2
    restart: unless-stopped
