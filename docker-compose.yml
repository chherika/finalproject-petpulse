      - NODE_ENV=production
      - PORT=8003
      - INSTANCE_ID=Pet-Service-Node-2
      - MONGO_URI=${MONGO_URI}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  registration:
    build: ./Registration
    image: petpulse/registration:1.0.0
    container_name: petpulse-registration
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8001
      - MONGO_URI=${MONGO_URI}
      - VET_INVITE_CODE=${VET_INVITE_CODE}
